# Render.com deployment configuration
services:
  # Backend API
  - type: web
    name: talentlink-backend
    env: python
    buildCommand: "pip install -r requirements-production.txt && python manage.py collectstatic --noinput && python manage.py migrate"
    startCommand: "gunicorn freelance_marketplace.wsgi:application"
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.0
      - key: DJANGO_SETTINGS_MODULE
        value: freelance_marketplace.settings_production
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: talentlink-db
          property: connectionString
      - key: DEBUG
        value: False
    
  # PostgreSQL Database
  - type: pgsql
    name: talentlink-db
    databaseName: talentlink
    user: talentlink_user
    plan: starter
