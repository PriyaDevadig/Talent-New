services:
  - type: web
    name: talentlink-backend
    env: python
    pythonVersion: 3.10.12
    rootDir: "Priya Narayan Devadig"

    buildCommand: >
      pip install -r requirements.txt &&
      python manage.py collectstatic --noinput &&
      python manage.py migrate

    startCommand: gunicorn freelance_marketplace.wsgi:application

    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: freelance_marketplace.settings_production
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: talentlink-db
          property: connectionString
      - key: DEBUG
        value: "False"

  - type: pgsql
    name: talentlink-db
    databaseName: talentlink
    user: talentlink_user
    plan: starter

